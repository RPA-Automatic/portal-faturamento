[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[context.production]
  command = "npm run build"

# Configuração pública incorporada ao bundle; nunca colocar service_role/secret aqui.
[context.production.environment]
# Habilitar individualmente após configurar e homologar cada aplicativo OAuth.
VITE_AUTH_OAUTH_PROVIDERS = ""
  VITE_PUBLIC_SITE_URL = "https://portal-fiscal-faturamento.netlify.app/"
  VITE_SUPABASE_URL = "https://eukazzizamxratkavcap.supabase.co"
  VITE_SUPABASE_ANON_KEY = "sb_publishable_ocqGpcA-fJGB7fsqWzcAHg_g07eOffM"

[context.dev]
  command = "npm run build"

[context.deploy-preview]
  command = "npm run build"
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://eukazzizamxratkavcap.supabase.co wss://eukazzizamxratkavcap.supabase.co; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
